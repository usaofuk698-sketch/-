# ---------------------------------------------------------------------------
# XauBreak — momentum-breakout scalper for XAUUSD M5.
#
# Mirrors mt5/XauBreak_M5.mq5. Replace the cost figures with numbers from YOUR
# broker: a scalper pays the spread on every one of many trades, so these
# decide the result far more than any strategy parameter does.
# ---------------------------------------------------------------------------
symbol: XAUUSD
timeframe: 5min
max_bars_in_trade: 36          # 3 hours; a breakout that has not moved has failed

account:
  initial_capital: 2000

data:
  path: null
  timezone: UTC

contract:
  symbol: XAUUSD
  contract_size: 100
  tick_size: 0.001             # 3-digit gold feed (e.g. Exness XAUUSDm)
  min_lot: 0.01
  lot_step: 0.01
  commission_per_lot_per_side: 0.0

costs:
  spread:
    base: 0.26                 # measured on a live Exness XAUUSDm feed
    hour_multipliers: {}
    rollover_hour: 0
    rollover_spread: 2.00
  slippage: 0.03

risk:
  risk_per_trade_pct: 0.5
  max_daily_loss_pct: 3.0
  max_trades_per_day: 12
  max_consecutive_losses: 8
  max_concurrent_positions: 1
  compounding: true
  min_stop_distance: 0.30
  max_stop_distance: 30.0
  max_spread: 0.50
  min_target_spread_ratio: 8.0
  trading_days: [0, 1, 2, 3, 4]
  sessions:
    - start_hour: 0
      end_hour: 24
  no_new_trades_after_hour: 24
  flat_by_hour: 24

strategy:
  name: breakout_momentum
  params:
    range_lookback: 12
    squeeze_max_atr: 4.00      # 2.2 gives ~1.3 trades/day at the same expectancy
    break_margin_atr: 0.05
    atr_period: 14
    min_bar_range_atr: 0.60
    close_position_min: 0.60
    regime_lookback: 288
    atr_min_mult: 0.55
    atr_max_mult: 3.00
    adx_period: 14
    adx_min: 0.0
    trend_ema_period: 100
    require_trend_alignment: false
    stop_atr_buffer: 0.20
    min_stop_atr_mult: 1.00
    reward_risk: 4.00          # the whole design; below ~2 the costs win
    min_target_spread_ratio: 8.0
    breakeven_at_r: null       # OFF on purpose - see the strategy docstring
    breakeven_offset_atr: 0.05
    trail_at_r: null

walkforward:
  train_bars: 30000
  test_bars: 10000
  grid:
    reward_risk: [3.0, 4.0, 5.0]
    squeeze_max_atr: [3.0, 4.0, 6.0]
    min_bar_range_atr: [0.5, 0.6, 0.8]
