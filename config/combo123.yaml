# ---------------------------------------------------------------------------
# 123 — one bot, five philosophies (breakout+retest, breakout momentum, trend
# pullback, mean-reversion scalp, volume-profile Wyckoff), dispatched in that
# priority order with exactly one position at a time.
#
# Mirrors mt5/123_M5.mq5. Replace the cost figures with numbers from YOUR
# broker: a scalper pays the spread on every one of many trades, so these
# decide the result far more than any strategy parameter does.
#
# UNVALIDATED COMBINATION: each of the five sub-strategies is separately
# shipped as its own EA and (breakout+retest aside) has no real Strategy
# Tester evidence gathered in this project. Running all five side by side is
# new on top of that -- their filters were tuned in isolation, not for this
# combination. Treat every number below as a starting point for real
# backtesting, not a proven setting.
# ---------------------------------------------------------------------------
symbol: XAUUSD
timeframe: 5min
max_bars_in_trade: 96          # 8 hours; generous enough for breakout-momentum's far target

account:
  initial_capital: 2000

data:
  path: null
  timezone: UTC

contract:
  symbol: XAUUSD
  contract_size: 100
  tick_size: 0.001             # 3-digit gold feed (e.g. Exness XAUUSDm)
  min_lot: 0.01
  lot_step: 0.01
  commission_per_lot_per_side: 0.0

costs:
  spread:
    base: 0.26                 # measured on a live Exness XAUUSDm feed
    hour_multipliers: {}
    rollover_hour: 0
    rollover_spread: 2.00
  slippage: 0.03

risk:
  risk_per_trade_pct: 0.5
  max_daily_loss_pct: 3.0
  max_trades_per_day: 10
  max_consecutive_losses: 6
  max_concurrent_positions: 1
  compounding: true
  min_stop_distance: 0.30
  max_stop_distance: 30.0
  max_spread: 0.50
  # The smallest of the five sub-strategies' own (informational) ratios --
  # mean-reversion's targets are the shortest by design, and this single
  # global gate must not reject its trades to protect the other four.
  min_target_spread_ratio: 5.0
  trading_days: [0, 1, 2, 3, 4]
  sessions:
    # Deliberately open all day -- see the class docstring in combo_123.py.
    # XauRetest's proven 8-10/12-16 GMT windows are proven for THAT
    # strategy's own filters, not for this five-way combination. Narrow this
    # once a real backtest shows which hours this combination should trade.
    - start_hour: 0
      end_hour: 24
  no_new_trades_after_hour: 24
  flat_by_hour: 24

strategy:
  name: combo_123
  params:
    enable_retest: true
    enable_breakout_momentum: true
    enable_trend_pullback: true
    enable_mean_reversion: true
    enable_wyckoff: true

    # ===== breakout + retest (XauRetest) =====
    rt_range_lookback: 20
    rt_break_margin_atr: 0.10
    rt_min_bar_range_atr: 0.50
    rt_atr_period: 14
    rt_regime_lookback: 288
    rt_atr_min_mult: 0.55
    rt_atr_max_mult: 3.00
    rt_adx_period: 14
    rt_adx_min: 15.0
    rt_htf_ema_period: 100
    rt_require_htf_alignment: true
    rt_retest_max_bars: 12
    rt_retest_tolerance_atr: 0.15
    rt_retest_close_position_min: 0.68
    rt_cooldown_bars: 12
    rt_stop_atr_buffer: 0.20
    rt_min_stop_atr_mult: 1.00
    rt_min_target_spread_ratio: 6.0
    rt_quality_min_reward_risk: 1.50
    rt_quality_max_reward_risk: 3.00
    rt_use_measured_move_target: true
    rt_quality_max_risk_mult: 1.50
    rt_breakeven_at_r: 1.0
    rt_breakeven_offset_atr: 0.05
    rt_trail_at_r: 1.5
    rt_trail_atr_mult: 1.20
    rt_use_immediate_breakout: false
    rt_immediate_breakout_min_strength: 0.60
    rt_immediate_breakout_reward_risk: 2.00
    rt_immediate_breakout_stop_atr_mult: 1.20

    # ===== breakout momentum (XauBreak) =====
    bk_range_lookback: 12
    bk_squeeze_max_atr: 4.00
    bk_break_margin_atr: 0.05
    bk_atr_period: 14
    bk_min_bar_range_atr: 0.60
    bk_close_position_min: 0.60
    bk_regime_lookback: 288
    bk_atr_min_mult: 0.55
    bk_atr_max_mult: 3.00
    bk_adx_period: 14
    bk_adx_min: 0.0
    bk_trend_ema_period: 100
    bk_require_trend_alignment: false
    bk_stop_atr_buffer: 0.20
    bk_min_stop_atr_mult: 1.00
    bk_reward_risk: 4.00
    bk_min_target_spread_ratio: 8.0
    bk_breakeven_at_r: null
    bk_breakeven_offset_atr: 0.05
    bk_trail_at_r: null

    # ===== trend pullback (XauTrend) =====
    tr_ema_fast: 21
    tr_ema_slow: 55
    tr_ema_trend: 200
    tr_adx_period: 14
    tr_adx_min: 22.0
    tr_atr_period: 14
    tr_regime_lookback: 288
    tr_atr_min_mult: 0.80
    tr_atr_max_mult: 2.50
    tr_rsi_period: 14
    tr_rsi_pullback_long: 45.0
    tr_rsi_pullback_short: 55.0
    tr_pullback_lookback: 8
    tr_swing_lookback: 12
    tr_stop_atr_buffer: 0.35
    tr_min_stop_atr_mult: 1.00
    tr_reward_risk: 1.8
    tr_breakeven_at_r: 1.0
    tr_breakeven_offset_atr: 0.10
    tr_trail_at_r: 1.5
    tr_trail_atr_mult: 1.5

    # ===== mean-reversion scalp (Anas) =====
    mr_ema_period: 20
    mr_adx_period: 14
    mr_adx_max: 50.0
    mr_atr_period: 14
    mr_regime_lookback: 288
    mr_atr_min_mult: 0.55
    mr_atr_max_mult: 3.00
    mr_stretch_atr: 0.60
    mr_rsi_period: 7
    mr_rsi_oversold: 38.0
    mr_rsi_overbought: 62.0
    mr_swing_lookback: 6
    mr_stop_atr_buffer: 0.25
    mr_min_stop_atr_mult: 1.30
    mr_reward_risk: 1.20
    mr_min_target_spread_ratio: 5.0
    mr_htf_ema_period: 100
    mr_htf_slope_lookback: 20
    mr_htf_max_slope_atr: 0.06
    mr_close_position_min: 0.55
    mr_require_divergence: false
    mr_divergence_lookback: 12
    mr_breakeven_at_r: 0.8
    mr_breakeven_offset_atr: 0.05
    mr_trail_at_r: null

    # ===== volume-profile Wyckoff (XauWyck) =====
    wk_profile_lookback: 96
    wk_profile_bins: 40
    wk_value_area_pct: 0.70
    wk_profile_update_bars: 12
    wk_probe_depth_atr: 0.10
    wk_close_back_margin_atr: 0.05
    wk_probe_volume_max: 1.40
    wk_close_position_min: 0.55
    wk_atr_period: 14
    wk_regime_lookback: 288
    wk_atr_min_mult: 0.55
    wk_atr_max_mult: 3.00
    wk_adx_period: 14
    wk_adx_max: 45.0
    wk_stop_atr_buffer: 0.30
    wk_min_stop_atr_mult: 1.00
    wk_reward_risk: 2.20
    wk_target_poc: true
    wk_min_target_spread_ratio: 6.0
    wk_breakeven_at_r: null
    wk_breakeven_offset_atr: 0.05
    wk_trail_at_r: null
